<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oliver Ludovici</title>
<meta name="description" content="Oliver Ludovici">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root { --bg: #faf7f2; --ink: #2b2420; }
@media (prefers-color-scheme: dark) { :root { --bg: #16130f; --ink: #f3ece2; } }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); display: flex; align-items: center; justify-content: center; padding: 16px; }
h1 { font-family: "Pinyon Script", cursive; font-weight: 400; font-size: clamp(3rem, 11vw, 9rem); line-height: 1.2; text-align: center; opacity: 0; animation: fade 1.6s ease-out forwards; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<h1>Oliver Ludovici</h1>
</body>
</html>
